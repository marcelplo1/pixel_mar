model:
  name: pixelMar_base_64
  dataset_name: ImageNet
  params:
    img_size: 64
    patch_size: 4
    in_channels: 3
    ema_decay: 0.9999
    t_eps: 5.0e-2
    sample_t_mean: 0.0
    sample_t_std: 1.0
    time_shift_base: 4096
    diffusion_batch_mul: 4
    pred_type: 'x'  
  mae_params:
    encoder_dim: 768
    encoder_depth: 12
    encoder_num_heads: 12
    decoder_dim: 768
    decoder_depth: 12
    decoder_num_heads: 12
    mlp_ratio: 4.0
    dropout: 0.1
    buffer_size: 64
    mask_ratio_min: 0.7
  denoiser_params:
    hidden_dim: 768
    depth: 3
    dropout: 0.1

sampler:
  method: 'euler'
  t_eps_sample: 1.0e-4
  num_generation_passes: 1 
  num_ar_steps: 16
  num_timesteps: 100
  noise_scale: 1.0









  
