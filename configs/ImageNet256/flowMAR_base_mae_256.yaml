model:
  name: pixelMar_base_mae_256
  dataset_name: ImageNet
  params:
    img_size: 256
    patch_size: 16
    in_channels: 3
    ema_decay: [0.999, 0.9995, 0.9999]
    t_eps: 5.0e-2
    sample_t_mean: 0.0
    sample_t_std: 1.0
    train_shift: 10.0
    sample_shift: 10.0
    t_sampling_method: 'logit_normal'
    diffusion_batch_mul: 1
    pred_type: 'x'
  rae_params:
    latent_type: 'mae'
    latent_dim: 768
    rae_encoder: 'facebook/vit-mae-base'
    rae_decoder_ckp: './rae_models/mae/model.pt'
    rae_norm_stats: './rae_models/mae/stat.pt'
    rae_decoder_config: './src/rae/rae_decoder_configs/ViTXL'
    encoder_input_size: 256
  ar_params:
    ar_type: 'decoder'
    decoder_dim: 768
    decoder_depth: 12
    decoder_num_heads: 12
    mlp_ratio: 4.0
    dropout: 0.0
    buffer_size: 64
    min_mask_rate: 0.7
  denoiser_params:
    hidden_dim: 768
    depth: 6
    dropout: 0.0

sampler:
  method: 'heun'
  num_generation_passes: 1
  t_eps_sample: 1.0e-4
  num_ar_steps: 64
  num_timesteps: 50
  noise_scale: 1.0