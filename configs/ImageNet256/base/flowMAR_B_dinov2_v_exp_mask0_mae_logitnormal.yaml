model:
  name: flowMAR_B_dinov2_v_exp_mask0_mae_logitnormal
  dataset_name: ImageNet_256
  params:
    img_size: 256
    in_channels: 3
    ema_decay: [0.999, 0.9995, 0.9999]
    sample_t_mean: 0.0
    sample_t_std: 1.0
    train_shift: 10.0
    sample_shift: 10.0
    t_sampling_method: 'logit_normal'
    diffusion_batch_mul: 1
    pred_type: 'v' 
  rae_params:
    latent_type: 'dinov2'
    latent_dim: 768
    rae_encoder: 'facebook/dinov2-with-registers-base'
    rae_decoder_ckp: './rae_models/dinov2/model.pt'
    rae_norm_stats: './rae_models/dinov2/stat.pt'
    rae_decoder_config: './src/rae/rae_decoder_configs/ViTXL'
  ar_params:
    ar_type: 'encoder_decoder'
    encoder_dim: 768
    encoder_depth: 2
    encoder_num_heads: 12
    decoder_dim: 768
    decoder_depth: 10
    decoder_num_heads: 12
    mlp_ratio: 4.0
    dropout: 0.1
    class_token_size: 64
    mask_rate_token_size: 8
    train_mask_schedule: 'exp'
    mask_condition: True
    min_s: 0.0
  denoiser_params:
    hidden_dim: 1024
    depth: 6
    hidden_ratio: 1.0
    dropout: 0.0
    
sampler:
  method: 'euler'
  mask_schedule: 'cosine'
  order_strategy: random
  num_ar_steps: 32
  num_timesteps: 50
  noise_scale: 1.0
