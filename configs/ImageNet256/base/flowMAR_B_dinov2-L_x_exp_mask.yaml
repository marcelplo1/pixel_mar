model:
  name: flowMAR_B_dinov2-L_x_exp-mask
  dataset_name: ImageNet_256
  params:
    img_size: 256
    patch_size: 16
    in_channels: 3
    ema_decay: [0.999, 0.9995, 0.9999]
    t_eps: 5.0e-2
    sample_t_mean: 0.0
    sample_t_std: 1.0
    train_shift: 6.93
    sample_shift: 6.93
    t_sampling_method: 'logit_normal'
    diffusion_batch_mul: 1
    pred_type: 'x'
  rae_params:
    latent_type: 'dinov2'
    latent_dim: 1024
    rae_encoder: 'facebook/dinov2-with-registers-large'
    rae_decoder_ckp: './rae_models/dinov2_large/model.pt'
    rae_norm_stats: './rae_models/dinov2_large/stat.pt'
    rae_decoder_config: './src/rae/rae_decoder_configs/ViTXL'
  ar_params:
    ar_type: 'decoder'
    decoder_dim: 1024
    decoder_depth: 12
    decoder_num_heads: 16
    mlp_ratio: 4.0
    dropout: 0.1
    class_token_size: 64
    mask_rate_token_size: 8
    train_mask_schedule: 'exp'
    mask_condition: False
    min_s: 0.2
  denoiser_params:
    hidden_dim: 1024
    depth: 6
    hidden_ratio: 4.0
    dropout: 0.0

sampler:
  method: 'euler'
  t_eps_sample: 1.0e-4
  mask_schedule: 'cosine'
  order_strategy: random
  num_ar_steps: 32
  num_timesteps: 50
  noise_scale: 1.0