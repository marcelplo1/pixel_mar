model:
  name: flowMAR_L_vae
  dataset_name: ImageNet_256
  params:
    img_size: 256
    in_channels: 3
    ema_decay: [0.999, 0.9995, 0.9999]
    train_shift: 1.0
    sample_shift: 1.0
    t_sampling_method: 'logit_normal'
    diffusion_batch_mul: 1
    pred_type: 'v'
  rae_params:
    latent_type: 'vae'
    latent_dim: 16
    vae_path: './tokenizer_models/vae/kl16.ckpt'
    latent_scale: 0.2325
  ar_params:
    ar_type: 'encoder_decoder'
    encoder_dim: 1024
    encoder_depth: 16
    encoder_num_heads: 12
    decoder_dim: 1024
    decoder_depth: 16
    decoder_num_heads: 12
    mlp_ratio: 4.0
    dropout: 0.1
    class_token_size: 64
    mask_rate_token_size: 8
    train_mask_schedule: 'exp'
    mask_condition: False
    min_s: 0.2
  denoiser_params:
    hidden_dim: 1536
    depth: 12
    hidden_ratio: 1.0
    dropout: 0.0
    
sampler:
  method: 'euler'
  mask_schedule: 'cosine'
  order_strategy: random
  num_ar_steps: 32
  num_timesteps: 50
  noise_scale: 1.0