model:
  name: pixelMar_large_dinov2_256
  dataset_name: ImageNet
  params:
    img_size: 256
    patch_size: 16
    in_channels: 3
    ema_decay: 0.9999
    t_eps: 5.0e-2
    sample_t_mean: 0.0
    sample_t_std: 1.0
    train_shift: 10.0
    sample_shift: 10.0
    t_sampling_method: 'logit_normal'
    diffusion_batch_mul: 1
    pred_type: 'x'
  rae_params:
    latent_dim: 768
    rae_encoder: 'facebook/dinov2-with-registers-base'
    rae_decoder_ckp: './rae_models/rae_decoder/model.pt'
    rae_norm_stats: './rae_models/rae_stats/stat.pt'
    rae_decoder_config: './src/rae/rae_decoder_configs/ViTXL'
  ar_params:
    decoder_dim: 1024
    decoder_depth: 32
    decoder_num_heads: 16
    mlp_ratio: 4.0
    dropout: 0.1
    buffer_size: 64
    mask_ratio_min: 0.7
  denoiser_params:
    hidden_dim: 1024
    depth: 12
    dropout: 0.0

sampler:
  method: 'heun'
  num_generation_passes: 1
  t_eps_sample: 1.0e-4
  num_ar_steps: 64
  num_timesteps: 50
  noise_scale: 1.0
